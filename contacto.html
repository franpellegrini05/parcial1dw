<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contacto</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-gray-100 text-gray-900">
  <header class="bg-gray-800 text-white sticky top-0 z-50 shadow">
    <nav class="container mx-auto flex justify-between items-center py-4 px-6">
      <h1 class="text-xl font-semibold">PARCIAL 1</h1>
      <ul class="flex gap-6">
        <li><a href="index.html" class="hover:text-blue-400">Inicio</a></li>
        <li><a href="avisos.html" class="hover:text-blue-400">Avisos</a></li>
        <li><a href="sobremi.html" class="hover:text-blue-400">Sobre mí</a></li>
        <li><a href="materias2025.html" class="hover:text-blue-400">Materias 2025</a></li>
        <li><a href="contacto.html" class="hover:text-blue-400">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main class="container mx-auto py-10 px-6 max-w-xl">
    <h2 class="text-3xl font-semibold text-blue-700 mb-6">Formulario de Contacto</h2>
    <form class="bg-white shadow-md rounded-lg p-6 space-y-4">
      <input type="text" placeholder="Nombre" class="w-full border border-gray-300 p-3 rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
      <input type="email" placeholder="Correo electrónico" class="w-full border border-gray-300 p-3 rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
      <input type="text" placeholder="Asunto" class="w-full border border-gray-300 p-3 rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
      <textarea placeholder="Mensaje" class="w-full border border-gray-300 p-3 rounded h-32 resize-none focus:outline-none focus:ring-2 focus:ring-blue-400"></textarea>
      <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition">Enviar</button>
    </form>
  </main>
</body>
</html>
